services:
  - type: web
    name: navan-line-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: TMD_API_KEY
        sync: false
      - key: TMD_PROVINCE
        value: นครพนม
